apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  labels:
    {{- include "hw07-postgres.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
type: Opaque
data:
  postgres-admin-password: {{ .Values.secrets.postgresAdminPassword | b64enc }}
  postgres-password: {{ .Values.secrets.postgresPassword  | b64enc }}